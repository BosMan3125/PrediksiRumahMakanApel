<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Rumah Makan Apel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-wrapper">
        <!-- SISI KIRI: FORM LOGIN -->
        <div class="login-box">
            <div class="login-header">
                <img src="images/logo.png" alt="Logo" class="app-logo">
                <h1>Login</h1>
                <p>Silahkan Masukkan Username dan Password</p>
            </div>

            <!-- PERHATIKAN: Tidak ada action dan method, hanya id="form-login" -->
            <form id="form-login">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Masukkan Username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Masukkan Password" required>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remember"> Ingat saya
                    </label>
                    <a href="lupa-password.html" class="forgot-password">Lupa Password?</a>
                </div>

                <button type="submit" class="btn-login">Login</button>

                <div class="register-link">
                    <p>Belum punya akun? <a href="daftar.html">Daftar di sini</a></p>
                </div>
            </form>
        </div>

        <!-- SISI KANAN: BANNER -->
        <div class="login-banner">
            <div class="banner-content">
                <h1>Selamat Datang</h1>
                <p>di Aplikasi Pemesanan Rumah Makan Apel Berbasis Web.</p>
            </div>
        </div>
    </div>

    <!-- INI WAJIB ADA DI PALING BAWAH -->
    <script src="js/login.js"></script>
</body>
</html>
