<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - Rumah Makan Apel</title>
    <link rel="stylesheet" href="css/lupa-password.css">
</head>
<body>
    <div class="lupa-wrapper">
        
        <!-- SISI KIRI: FORM LUPA PASSWORD -->
        <div class="lupa-box">
            <div class="lupa-header">
                <h1>Lupa Password</h1>
                <p>Masukkan Nama, Nomor Hp dan alamat untuk mendapatkan Password</p>
            </div>

            <form id="form-lupa-password">
                <div class="form-group">
                    <label for="nama">Masukkan Nama</label>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan nama..." required>
                </div>

                <div class="form-group">
                    <label for="no_hp">Nomor HP</label>
                    <input type="text" id="no_hp" name="no_hp" placeholder="Masukkan nomor HP...." required>
                </div>

                <div class="form-group">
                    <label for="alamat">Alamat</label>
                    <input type="text" id="alamat" name="alamat" placeholder="Masukkan alamat...." required>
                </div>

                <button type="submit" class="btn-kirim">Kirim</button>
            </form>
        </div>

        <!-- SISI KANAN: BANNER -->
        <div class="lupa-banner">
            <div class="banner-header">
                <img src="images/logo.png" alt="Logo" class="banner-logo">
                <span class="banner-title">Rumah Makan Apel</span>
            </div>
            <div class="banner-content">
                <h1>Selamat Datang</h1>
                <p>di Aplikasi Pemesanan Rumah Makan Apel Berbasis Web.</p>
            </div>
        </div>

    </div>

    <script src="js/lupa-password.js"></script>
</body>
</html>
